<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>EventParking - Customer Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link href="css/style.css"
          rel="stylesheet">
</head>

<body>

    <!-- ==================== NAVBAR ==================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- Logo / Brand -->
            <a class="navbar-brand"
               href="index.html">
                EventParking
            </a>


            <!-- Mobile Navbar Button -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#nav"
                    aria-controls="nav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navbar Links -->
            <div id="nav"
                 class="collapse navbar-collapse">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link"
                       href="events.html">
                        Events
                    </a>

                    <a class="nav-link active"
                       href="customer-dashboard.html">
                        Dashboard
                    </a>

                    <a class="nav-link"
                       href="my-bookings.html">
                        Bookings
                    </a>

                    <a class="nav-link"
                       href="notifications.html">
                        Notifications
                    </a>

                    <a class="nav-link"
                       href="payments.html">
                        Payments
                    </a>

                    <a class="nav-link"
                       href="admin.html">
                        Admin
                    </a>

                    <a class="nav-link"
                       href="login.html">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- ==================== CUSTOMER DASHBOARD ==================== -->

    <div class="container py-5">

        <!-- Welcome + Logout -->

        <div class="d-flex justify-content-between align-items-center">

            <h2 class="page-title">
                Welcome,
                <span id="customerName"></span>
            </h2>

            <button class="btn btn-outline-danger"
                    type="button"
                    onclick="logout()">

                Logout

            </button>

        </div>


        <!-- ==================== DASHBOARD STATISTICS ==================== -->

        <div id="stats"
             class="row g-3 mt-2">

            <!--
                customer.js automatically loads
                dashboard statistics here.
            -->

        </div>

    </div>


    <!-- ==================== JAVASCRIPT ==================== -->
    <!-- Common API -->
    <script src="js/api.js"></script>

    <!-- Customer Functions -->
    <script src="js/customer.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
